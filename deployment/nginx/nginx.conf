# ── Nginx load balancer config ────────────────────────────────────────────────
#
# Strategy: round-robin over 3 app replicas.
# Sticky sessions are NOT used — all app nodes share the same index volume,
# so any node can serve any request.
#
# Rate limiting: 60 req/min per IP — tune to your traffic profile.
# For million-document corpora, retrieval is CPU-bound; add upstream nodes
# rather than increasing per-node concurrency.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # ── upstream pool ─────────────────────────────────────────────────────────
    upstream retrieval_app {
        least_conn;               # route to least-busy node

        server app1:8000 max_fails=3 fail_timeout=10s;
        server app2:8000 max_fails=3 fail_timeout=10s;
        server app3:8000 max_fails=3 fail_timeout=10s;

        keepalive 64;             # re-use connections — reduces TCP overhead
    }

    # ── server block ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 100m;   # allow large document uploads
        proxy_read_timeout   120s;   # LLM generation can be slow
        proxy_send_timeout   30s;

        # ── liveness probe (no rate limit) ────────────────────────────────────
        location /health {
            proxy_pass http://retrieval_app;
            access_log off;
        }

        # ── API ───────────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass       http://retrieval_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable connection keep-alive to upstream
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── upload endpoint — larger burst tolerance ──────────────────────────
        location /api/v1/ingest/upload {
            limit_req zone=api burst=5 nodelay;
            proxy_pass            http://retrieval_app;
            proxy_set_header Host $host;
            client_max_body_size  500m;
            proxy_read_timeout    300s;
        }
    }
}
